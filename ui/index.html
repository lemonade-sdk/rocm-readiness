<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#1a1a1b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f3f4f5"
      media="(prefers-color-scheme: light)"
    />
    <script>
      try {
        var theme = localStorage.getItem("rocm-readiness-theme");
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark" ? theme : "system";
      } catch (_) {}
    </script>
    <meta
      name="description"
      content="Stable ROCm llama.cpp readiness and published build evidence."
    />
    <title>ROCm Readiness · Signal Deck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
