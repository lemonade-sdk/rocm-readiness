name: Collect dashboard data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test adapters and collection
        run: python -m unittest discover -s tests -v
      - name: Collect immutable source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect.py --sources sources.json --output-dir data
      - name: Upload dataset and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          if-no-files-found: warn
          retention-days: 30
