name: Dashboard incident notifications

on:
  workflow_run:
    workflows: ['Collect dashboard data']
    types: [completed]
  workflow_dispatch:
    inputs:
      live:
        description: 'Dispatch to approved configured recipients (requires rollout enablement)'
        type: boolean
        default: false
      test_id:
        description: 'Optional controlled test ID; uses only the separate test-recipient secret'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: collect-data-refs/heads/main
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request')) &&
      (vars.ROCM_READINESS_NOTIFICATIONS_ENABLED == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.test_id != '')) &&
      (github.event_name != 'workflow_dispatch' || inputs.live)
    environment: notifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Persist intent and dispatch approved GitHub notifications
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROCM_READINESS_NOTIFICATION_LIST: ${{ secrets.ROCM_READINESS_NOTIFICATION_LIST }}
          ROCM_READINESS_TEST_NOTIFICATION_LIST: ${{ secrets.ROCM_READINESS_TEST_NOTIFICATION_LIST }}
          NOTIFICATION_TEST_ID: ${{ inputs.test_id }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=(--dataset data --live --checkpoint-git --repository "$GH_REPO")
          if [ -n "$NOTIFICATION_TEST_ID" ]; then
            args+=(--test-notification "$NOTIFICATION_TEST_ID"
                   --output "$RUNNER_TEMP/notification-test.json")
          else
            args+=(--output data/notifications.json)
          fi
          python3 scripts/notify.py "${args[@]}"
      - name: Retain sanitized controlled-test acceptance
        if: ${{ inputs.test_id != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notification-test-${{ github.run_id }}
          path: ${{ runner.temp }}/notification-test.json
          retention-days: 7

  publish-assessments:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request')) &&
      vars.ROCM_READINESS_NOTIFICATIONS_ENABLED != 'true' &&
      (github.event_name != 'workflow_dispatch' || !inputs.live)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Publish public assessments without recipients or delivery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/notify.py --dataset data --checkpoint-git \
            --repository "$GH_REPO" --output data/notifications.json
