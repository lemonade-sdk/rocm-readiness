name: Collect dashboard data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Test adapters and collection
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -v
      - name: Collect immutable source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python scripts/collect.py --sources sources.json --output-dir data
      - name: Upload dataset and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          if-no-files-found: warn
          retention-days: 30
