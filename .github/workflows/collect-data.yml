name: Collect dashboard data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Restore previous main dataset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prior_record=$(gh api "repos/${GH_REPO}/actions/workflows/collect-data.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0] | if . then "\(.id) \(.run_attempt)" else "" end')
          if [ -n "$prior_record" ]; then
            read -r prior_run_id prior_attempt <<< "$prior_record"
            gh run download "$prior_run_id" --pattern "readiness-data-${prior_run_id}-${prior_attempt}" --dir previous-data
            test -f previous-data/index.json
          fi
      - name: Run pipeline tests and ingestion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--sources sources.json --output-dir data)
          if [ -f previous-data/index.json ]; then
            args+=(--previous-data previous-data)
          fi
          uv run --no-project --python 3.12 python scripts/check.py "${args[@]}"
      - name: Upload dataset and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          if-no-files-found: warn
          retention-days: 30
